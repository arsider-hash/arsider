name: assistant-ci

on:
  pull_request:
    paths:
      - 'assistant/**'
      - '.github/workflows/assistant-ci.yml'
  push:
    branches:
      - arsider-assistant-v0
    paths:
      - 'assistant/**'
      - '.github/workflows/assistant-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test simulator
        run: printf '/status\n/on\ntrovami un pdf\n/stop\nquit\n' | python simulate.py
      - name: Verify safe defaults
        run: |
          test ! -f .env
          grep -q '^ADMIN_IDS=$' .env.example
          grep -q '^DASHBOARD_HOST=127.0.0.1$' .env.example
