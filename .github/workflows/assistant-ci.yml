name: assistant-ci

on:
  pull_request:
    paths:
      - 'assistant/**'
      - '.github/workflows/assistant-ci.yml'
  push:
    branches:
      - arsider-assistant-v0
    paths:
      - 'assistant/**'
      - '.github/workflows/assistant-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test simulator
        run: printf '/status\nquit\n' | python simulate.py
