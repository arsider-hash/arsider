name: ARBBOT funding scout manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only funding scanner
        run: python arbbot/funding_scanner.py
