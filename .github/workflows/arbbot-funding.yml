name: ARBBOT funding scout

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbbot-funding
  cancel-in-progress: false

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read public funding data
        run: python arbbot/funding_scanner.py
      - name: Persist latest snapshot
        run: |
          git config user.name "arbbot"
          git config user.email "actions@users.noreply.github.com"
          git add arbbot/data/funding_latest.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "arbbot: funding snapshot"
            git push
          fi
