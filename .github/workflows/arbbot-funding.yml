name: ARBBOT funding scout

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbbot-writes
  cancel-in-progress: false

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and normalize public funding data
        run: python arbbot/funding_scanner.py

      - name: Persist funding history
        run: |
          git config user.name "arbbot"
          git config user.email "actions@users.noreply.github.com"
          git add arbbot/data/funding_latest.json arbbot/data/funding_history.csv
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "arbbot: funding observation"
            git pull --rebase
            git push
          fi
