name: ARBBOT unified lab

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
    # Low-frequency fallback heartbeat. GitHub scheduled runs are best-effort;
    # this gives the lab an additional hourly chance to recover from missed
    # quarter-hour slots without changing any research or validation gates.
    - cron: "6 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "arbbot/*.py"
      - ".github/workflows/arbbot-market-lab.yml"

permissions:
  contents: write

# The funding sampler runs on quarter-hours and holds the same write lock for
# roughly six minutes. Keep this fallback scan offset from those bursts so
# scheduled jobs do not continuously compete for a single pending slot.
concurrency:
  group: arbbot-unified-writes
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Solana cross-DEX
        continue-on-error: true
        run: python arbbot/scanner.py
      - name: Scan funding
        continue-on-error: true
        run: python arbbot/funding_scanner.py
      - name: Scan global public CEX markets
        continue-on-error: true
        run: python arbbot/cex_market_scout.py
      - name: Scan wide high-turnover cross-CEX universe
        continue-on-error: true
        run: python arbbot/wide_cex_scout.py
      - name: Scan EU EUR routes
        continue-on-error: true
        run: python arbbot/eu_cex_scout.py
      - name: Scan stable-yield subsidies
        continue-on-error: true
        run: python arbbot/yield_scout.py
      - name: Build persistence scoreboard
        run: python arbbot/scoreboard.py
      - name: Rank small-capital economics
        run: python arbbot/capital_engine.py
      - name: Preliminary decision
        run: python arbbot/decision_engine.py
      - name: Burst-validate promoted fast edges
        continue-on-error: true
        run: python arbbot/burst_validator.py
      - name: Validate cross-venue order-book depth
        continue-on-error: true
        run: python arbbot/depth_validator.py
      - name: Diagnose stablecoin round-trip economics
        continue-on-error: true
        run: python arbbot/stable_roundtrip_validator.py
      - name: Adversarial killer falsification
        run: python arbbot/killer.py
      - name: Dedicated funding killer
        env:
          KILLER_STRATEGY: funding_spread
          KILLER_SELECTION: allocator
          KILLER_OUT: killer_funding_report.json
        run: python arbbot/killer.py
      - name: Re-evaluate after execution and killer checks
        run: python arbbot/decision_engine.py
      - name: Record conservative shadow canary
        continue-on-error: true
        run: python arbbot/shadow_ledger.py
      - name: Refresh killer against latest shadow evidence
        run: python arbbot/killer.py
      - name: Refresh dedicated funding killer
        env:
          KILLER_STRATEGY: funding_spread
          KILLER_SELECTION: allocator
          KILLER_OUT: killer_funding_report.json
        run: python arbbot/killer.py
      - name: ALLOCATOR keep only KILLER survivors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('arbbot/data')
          rank_path = d / 'capital_rank.json'
          rank = json.loads(rank_path.read_text())
          reports = []
          for name in ('killer_report.json', 'killer_funding_report.json'):
              p = d / name
              if p.exists():
                  try:
                      reports.append(json.loads(p.read_text()))
                  except Exception:
                      pass
          survivors = set()
          for r in reports:
              s = r.get('selected') or {}
              if r.get('verdict') == 'SURVIVES_KILLER' and s.get('strategy') and s.get('label'):
                  survivors.add(f"{s['strategy']}|{s['label']}")
          original = rank.get('ranked') or []
          filtered = [x for x in original if f"{x.get('strategy')}|{x.get('label')}" in survivors]
          rank['pre_killer_ranked_count'] = len(original)
          rank['killer_survivor_keys'] = sorted(survivors)
          rank['allocator_gate'] = 'killer_survivors_only'
          rank['ranked'] = filtered
          rank['best'] = filtered[0] if filtered else None
          rank_path.write_text(json.dumps(rank, indent=2))
          print(f"allocator survivors={len(filtered)} keys={sorted(survivors)}")
          PY
      - name: Re-run first-class KILLER on surviving ALLOCATOR leader
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('arbbot/data/decision.json')
          rank = json.loads(Path('arbbot/data/capital_rank.json').read_text())
          best = rank.get('best')
          if best:
              d = json.loads(p.read_text()) if p.exists() else {}
              d['selected'] = best
              p.write_text(json.dumps(d, indent=2))
          PY
          python arbbot/killer.py
      - name: Final decision
        run: python arbbot/decision_engine.py
      - name: Write health heartbeat
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("arbbot/data")
          p.mkdir(exist_ok=True)
          scanner_errors = {}
          for name in ("market_latest.json", "eu_latest.json", "funding_latest.json", "latest.json", "yield_latest.json"):
              f = p / name
              if not f.exists():
                  scanner_errors[name] = ["missing_output"]
                  continue
              try:
                  data = json.loads(f.read_text())
                  errors = data.get("errors") or []
                  if errors:
                      scanner_errors[name] = errors
              except Exception as exc:
                  scanner_errors[name] = [f"unreadable_output: {exc}"]
          status = "degraded_scanner_coverage" if scanner_errors else "healthy"
          (p / "health.json").write_text(json.dumps({
              "unified_lab_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "status": status,
              "scanner_errors": scanner_errors,
          }, indent=2))
          PY
      - name: Persist all research data atomically
        run: |
          set -euo pipefail
          git config user.name "arbbot"
          git config user.email "actions@users.noreply.github.com"
          snapshot_dir="$(mktemp -d)"
          cp -a arbbot/data "$snapshot_dir/data"
          git fetch origin main
          git reset --hard origin/main
          rm -rf arbbot/data
          mkdir -p arbbot
          cp -a "$snapshot_dir/data" arbbot/data
          git add -A arbbot/data
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "arbbot: unified observation"
            git push origin HEAD:main
          fi