name: ARBBOT market lab

on:
  schedule:
    - cron: "1/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "arbbot/*.py"
      - ".github/workflows/arbbot-market-lab.yml"

permissions:
  contents: write

concurrency:
  group: arbbot-writes
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan global public CEX markets
        run: python arbbot/cex_market_scout.py

      - name: Scan EU EUR routes with conservative fees
        run: python arbbot/eu_cex_scout.py

      - name: Scan stable-yield subsidies
        run: python arbbot/yield_scout.py

      - name: Build persistence scoreboard
        run: python arbbot/scoreboard.py

      - name: Rank small-capital economics
        run: python arbbot/capital_engine.py

      - name: Preliminary decision
        run: python arbbot/decision_engine.py

      - name: Burst-validate promoted fast edges
        run: python arbbot/burst_validator.py

      - name: Validate cross-venue order-book depth
        run: python arbbot/depth_validator.py

      - name: Re-evaluate after execution checks
        run: python arbbot/decision_engine.py

      - name: Record conservative shadow canary
        run: python arbbot/shadow_ledger.py

      - name: Final decision after shadow history
        run: python arbbot/decision_engine.py

      - name: Persist research data
        run: |
          git config user.name "arbbot"
          git config user.email "actions@users.noreply.github.com"
          git add             arbbot/data/market_history.csv             arbbot/data/market_latest.json             arbbot/data/eu_history.csv             arbbot/data/eu_latest.json             arbbot/data/yield_history.csv             arbbot/data/yield_latest.json             arbbot/data/scoreboard.json             arbbot/data/capital_rank.json             arbbot/data/validation.json             arbbot/data/depth_validation.json             arbbot/data/shadow_trades.csv             arbbot/data/shadow_summary.json             arbbot/data/decision.json
          if git diff --cached --quiet; then
            echo "No data change"
          else
            git commit -m "arbbot: execution-realism observation"
            git pull --rebase
            git push
          fi
