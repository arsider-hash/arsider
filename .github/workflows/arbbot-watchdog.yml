name: ARBBOT stale-pipeline watchdog

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
    paths:
      - "arbbot/data/**"
      - ".github/workflows/arbbot-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check research heartbeat age
        id: stale
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          # Match the first-class KILLER/current-signal freshness gate. The
          # watchdog must recover research before accepting a looser age than
          # the validators themselves accept.
          max_age_seconds = 900
          now = datetime.now(timezone.utc)

          def read_stamp(filename, field):
              p = Path(filename)
              if not p.exists():
                  return None
              try:
                  value = json.loads(p.read_text()).get(field)
                  if value:
                      return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  pass
              return None

          sampler = read_stamp("arbbot/data/funding_sampler_health.json", "funding_sampler_utc")
          lab = read_stamp("arbbot/data/health.json", "unified_lab_utc")
          sampler_age = (now - sampler).total_seconds() if sampler else float("inf")
          lab_age = (now - lab).total_seconds() if lab else float("inf")
          sampler_stale = sampler_age > max_age_seconds
          lab_stale = lab_age > max_age_seconds

          print(
              f"funding_sampler={sampler.isoformat() if sampler else 'missing'} "
              f"sampler_age_seconds={sampler_age:.0f} sampler_stale={sampler_stale} "
              f"unified_lab={lab.isoformat() if lab else 'missing'} "
              f"lab_age_seconds={lab_age:.0f} lab_stale={lab_stale}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"sampler_stale={'true' if sampler_stale else 'false'}\n")
              fh.write(f"lab_stale={'true' if lab_stale else 'false'}\n")
          PY

      - name: Check active funding recovery
        if: steps.stale.outputs.sampler_stale == 'true'
        id: funding_active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --workflow arbbot-funding-sampler.yml --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active=$active"
          echo "count=$active" >> "$GITHUB_OUTPUT"

      - name: Recover stale funding sampler
        if: steps.stale.outputs.sampler_stale == 'true' && steps.funding_active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Funding sampler heartbeat is stale; dispatching funding sampler."
          gh workflow run arbbot-funding-sampler.yml --ref main

      - name: Check active unified-lab recovery
        if: steps.stale.outputs.lab_stale == 'true'
        id: lab_active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --workflow arbbot-market-lab.yml --limit 10 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active=$active"
          echo "count=$active" >> "$GITHUB_OUTPUT"

      - name: Recover stale unified lab
        if: steps.stale.outputs.lab_stale == 'true' && steps.lab_active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Unified lab heartbeat is stale; dispatching unified lab."
          gh workflow run arbbot-market-lab.yml --ref main

      - name: Safety boundary
        run: |
          echo "Watchdog may only dispatch paper-research workflows. It cannot place orders, move funds, sign transactions, or alter strategy gates."
