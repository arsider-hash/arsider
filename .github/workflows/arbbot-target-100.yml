name: ARBBOT EUR100 challenge

on:
  workflow_run:
    workflows: ["ARBBOT unified lab"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbbot-target-100-writes
  cancel-in-progress: false

jobs:
  challenge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate EUR100 feasibility without optimistic scaling
        run: python arbbot/target_100_engine.py
      - name: Persist challenge result
        run: |
          set -euo pipefail
          git config user.name "arbbot"
          git config user.email "actions@users.noreply.github.com"
          git add arbbot/data/target_100.json
          if git diff --cached --quiet; then
            echo "No challenge change"
          else
            git commit -m "arbbot: refresh EUR100 feasibility"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
