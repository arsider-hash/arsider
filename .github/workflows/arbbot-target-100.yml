name: ARBBOT EUR100 challenge

on:
  workflow_run:
    workflows: ["ARBBOT unified lab"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - "arbbot/capital_scheduler.py"
      - "arbbot/opportunity_event.py"
      - "arbbot/crypto_event_adapter.py"
      - "arbbot/betfair_replay_adapter.py"
      - "arbbot/betfair_hunter.py"
      - "arbbot/habitat_board.py"
      - "arbbot/target_100_engine.py"
      - "arbbot/turnover_rank.py"
      - "arbbot/test_capital_scheduler.py"
      - "arbbot/test_event_adapters.py"
      - ".github/workflows/arbbot-target-100.yml"

permissions:
  contents: write

concurrency:
  group: arbbot-target-100-writes
  cancel-in-progress: false

jobs:
  challenge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify chronological capital-conflict logic
        run: python arbbot/test_capital_scheduler.py
      - name: Verify crypto and Betfair event-adapter logic
        run: python arbbot/test_event_adapters.py
      - name: Convert fresh crypto KILLER survivors into scheduler events
        run: python arbbot/crypto_event_adapter.py
      - name: Stress-test Betfair replay snapshots if present
        run: python arbbot/betfair_replay_adapter.py
      - name: Ingest Betfair executable-shadow events if present
        run: python arbbot/betfair_hunter.py
      - name: Rank high-turnover opportunities by NET EUR per capital-hour
        run: python arbbot/turnover_rank.py
      - name: Simulate one shared EUR250 capital pool
        run: python arbbot/capital_scheduler.py
      - name: Build cross-habitat board
        run: python arbbot/habitat_board.py
      - name: Evaluate EUR100 feasibility without optimistic scaling
        run: python arbbot/target_100_engine.py
      - name: Persist challenge evidence
        run: |
          set -euo pipefail
          git config user.name "arbbot"
          git config user.email "actions@users.noreply.github.com"
          git add             arbbot/data/crypto_event_adapter_latest.json             arbbot/data/betfair_replay_latest.json             arbbot/data/betfair_latest.json             arbbot/data/turnover_rank.json             arbbot/data/capital_schedule.json             arbbot/data/habitat_board.json             arbbot/data/target_100.json
          if [ -f arbbot/data/betfair_inbox.jsonl ]; then
            git add arbbot/data/betfair_inbox.jsonl
          fi
          if [ -f arbbot/data/opportunity_events.jsonl ]; then
            git add arbbot/data/opportunity_events.jsonl
          fi
          if git diff --cached --quiet; then
            echo "No challenge change"
            exit 0
          fi

          git commit -m "arbbot: refresh multi-habitat EUR100 proof"

          # Other ARBBOT scanners also persist generated evidence to main. A
          # successful rebase can therefore still lose the race before push.
          # Retry the fetch/rebase/push sequence instead of failing the whole
          # research pipeline on a transient non-fast-forward update.
          for attempt in 1 2 3 4 5; do
            echo "Persist attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict is not a transient race; refusing to overwrite evidence."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Challenge evidence persisted"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Failed to persist challenge evidence after 5 race-safe attempts"
          exit 1
